name: Update Meetings & Deploy

on:
  schedule:
    # Every 4 hours. Catches freshly-uploaded videos in the same evening so
    # auto-captions have ~6 attempts in the first 24 hours before falling
    # back to agenda-only.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill ALL historical meetings (true/false)'
        required: false
        default: 'false'
      days:
        description: 'Process meetings from last N days (e.g. 21). Ignored if backfill=true.'
        required: false
        default: ''
      reprocess:
        description: 'Comma-separated video IDs to force reprocess'
        required: false
        default: ''
      inject_transcript:
        description: 'Video ID to inject transcript for (file must be in transcripts/VIDEO_ID.txt)'
        required: false
        default: ''
      roundup:
        description: 'Generate the weekly newsletter roundup now (true/false; also auto-runs Mondays)'
        required: false
        default: 'false'
      upgrade_window_days:
        description: 'Widen the sb-video/kw-minutes upgrade windows to N days (recovery after an outage; default 45)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'pages'
  # A newer scheduled run supersedes an older one. In August 2026 a run
  # wedged in "waiting" state held this group for 23 days while every later
  # run queued behind it and was silently cancelled — with runs every 4h and
  # a normal duration of ~15 min, cancelling an in-flight run only ever
  # happens when something is already stuck.
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # Backstop for hung fetches: a normal run finishes in ~15 minutes, but a
    # post-outage recovery ingesting dozens of transcripts can run over an
    # hour — nothing commits until the end, so a mid-run kill re-spends the
    # API budget on retry.
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Deno
        # yt-dlp needs a JavaScript runtime to solve YouTube's "n challenge"
        # that wraps subtitle URLs. Without it, fetches fall back to the
        # "Only images are available" path and the summarizer treats videos
        # as having no captions even when they do.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke-check upstream data sources
        # Non-strict: warn if anything's off but don't block the run. Schema
        # breakage in CivicClerk / AgendaCenter / BoardBook will print loud
        # FAIL lines that show up at the top of the run log.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python smoke_check.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Write YouTube cookies
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt-cookies.txt
            echo "Cookies file written."
          else
            echo "No YOUTUBE_COOKIES secret set — transcripts may fail on CI IPs."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Reprocess specific videos (if requested)
        env:
          REPROCESS_IDS: ${{ github.event.inputs.reprocess }}
        run: python reprocess.py

      - name: Run meeting summarizer
        id: summarize
        # Don't abort the workflow if summarization fails (e.g. API credit
        # exhaustion, June 2026): the site should still rebuild and deploy
        # with whatever data we have. A final step re-surfaces the failure.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES_FILE: /tmp/yt-cookies.txt
          # Whisper is local-only; the lib isn't installed in CI (saves ~150 MB
          # download per run) and the summarizer no-ops the fallback when this
          # flag is false. Set to "true" locally if you want audio transcription.
          USE_WHISPER_FALLBACK: "false"
          # YouTube blocks caption/metadata fetches from cloud IPs regardless
          # of cookies (verified Aug 30, 2026); skipping the attempts avoids
          # false "cookies expired" alarms. The residential sweep fetches
          # transcripts. Flip to "true" if YouTube's posture relaxes.
          CAPTION_FETCH: "false"
          # Optional dispatch override — widens both upgrade-pass windows so
          # meetings that aged past 45 days during an outage get re-attempted.
          SCHOOL_BOARD_VIDEO_DAYS: ${{ github.event.inputs.upgrade_window_days || '45' }}
          KRONENWETTER_MINUTES_DAYS: ${{ github.event.inputs.upgrade_window_days || '45' }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python marathon_meeting_summarizer.py --backfill
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python marathon_meeting_summarizer.py --days ${{ github.event.inputs.days }}
          else
            python marathon_meeting_summarizer.py --days 14
          fi

      - name: Override agenda-only meetings with transcripts
        id: inject_transcripts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -d transcripts ] || [ -z "$(ls transcripts/*.txt 2>/dev/null)" ]; then
            echo "No transcript files found — skipping."
            exit 0
          fi
          # Per-file isolation: this step runs under bash -e, so without the
          # guard one bad transcript (metadata query hiccup, API blip) would
          # abort the loop and strand every file after it until a later run.
          FAILED=0
          for TFILE in transcripts/*.txt; do
            VID=$(basename "$TFILE" .txt)
            echo "Processing transcript for: $VID"
            # --video-id= (equals form): YouTube IDs can start with a dash
            # (e.g. -SFidjEgoHg), which argparse otherwise eats as a flag.
            python inject_transcript.py --video-id="$VID" --transcript "$TFILE" \
              || { echo "::warning::transcript ingest failed for $VID (will retry next run)"; FAILED=$((FAILED+1)); }
            echo ""
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED transcript(s) failed to ingest"
            exit 1
          fi

      - name: Inject meeting summaries into JSX
        run: |
          echo "Working directory: $(pwd)"
          echo "Files present:"
          ls -la *.json summaries/ 2>/dev/null || true
          echo "processed_meetings.json contents (first 200 chars):"
          head -c 200 processed_meetings.json 2>/dev/null || echo "FILE NOT FOUND"
          echo ""
          python inject_meetings.py

      - name: Update upcoming meetings
        run: python update_upcoming.py

      - name: Backfill topic tags
        # Tags meetings that predate the topics field (batched Haiku; skips
        # everything already tagged, so steady-state cost is zero calls).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backfill_topics.py

      - name: Backfill structured votes
        # Extracts votes[] for outcome-based meetings that predate the field
        # (batched Haiku; presence of the votes key = processed, so
        # steady-state cost is zero calls).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backfill_votes.py

      - name: Generate static meeting pages + sitemap
        # Indexable HTML per meeting (the JS app in an iframe is invisible to
        # search engines). Old pages persist as the permanent archive.
        continue-on-error: true
        run: python generate_pages.py

      - name: Generate calendar feed (.ics)
        continue-on-error: true
        run: python generate_ics.py --out public/meetings.ics

      - name: Generate weekly newsletter roundup
        # Mondays (UTC) or on demand via the roundup dispatch input — one
        # Sonnet call per generation. The cron fires ~6x on Mondays, so the
        # guard checks whether today's roundup was already committed (via
        # the API — the checkout is shallow, so local git log can't tell).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=0
          if [ "${{ github.event.inputs.roundup }}" = "true" ]; then
            RUN=1
          elif [ "$(date -u +%u)" = "1" ]; then
            LAST=$(gh api "repos/${{ github.repository }}/commits?path=public/roundup.txt&per_page=1" \
              --jq '.[0].commit.committer.date[:10] // empty' 2>/dev/null || echo "")
            if [ "$LAST" = "$(date -u +%F)" ]; then
              echo "Roundup already generated today ($LAST) — skipping."
            else
              RUN=1
            fi
          fi
          if [ "$RUN" = "1" ]; then
            python generate_roundup.py
          else
            echo "Not Monday and roundup not requested — skipping."
          fi

      - name: Generate weekly digest PNG
        # Newsletter image of the coming week's meetings. Written to public/ so
        # the Vite build copies it into dist/ → served at /marathon-meetings/digest.png.
        # continue-on-error: a digest failure must never block the deploy.
        continue-on-error: true
        run: python generate_digest.py --out public/digest.png

      - name: Commit data and deploy assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f src/data/meetings.json || true
          git add -f src/data/upcoming.json || true
          git add -f injected_meetings.json || true
          git add -f processed_meetings.json || true
          git add -f skipped_videos.json || true
          git add -f summaries/ || true
          git add -f public/digest.png || true
          git add -f public/meetings.ics || true
          git add -f public/roundup.txt public/roundup.html 2>/dev/null || true
          git add -f public/meetings/ public/sitemap.xml public/robots.txt || true
          git status
          git diff --staged --quiet || git commit -m "chore: update meetings data [skip ci]"
          # Rebase before pushing: an operator push landing mid-run would
          # otherwise make this push fail silently and discard the run's
          # state (re-summarizing everything next run = double API spend).
          git pull --rebase origin main || true
          git push || true

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create agenda-only issue (if any)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f agenda_only_report.json ]; then
            echo "No agenda-only report — skipping issue creation."
            exit 0
          fi
          COUNT=$(python -c "import json; d=json.load(open('agenda_only_report.json')); print(len(d.get('agenda_only',[])))")
          if [ "$COUNT" = "0" ]; then
            echo "No agenda-only meetings — skipping issue creation."
            exit 0
          fi
          BODY=$(python -c "
          import json
          d = json.load(open('agenda_only_report.json'))
          lines = ['## Agenda-Only Meetings Need Transcripts\n']
          lines.append(f'{len(d[\"agenda_only\"])} meeting(s) were summarized from agenda documents only.')
          lines.append('These summaries show what was *scheduled*, not what *actually happened*.\n')
          lines.append('**To fix:** Grab the transcript from the YouTube app and run:')
          lines.append('\`\`\`')
          lines.append('python inject_transcript.py --video-id VIDEO_ID --transcript transcript.txt')
          lines.append('\`\`\`\n')
          lines.append('| Meeting | Source | Status |')
          lines.append('|---------|--------|--------|')
          for m in d['agenda_only']:
              vote = ' (has votes)' if m.get('_source') == 'agenda_with_votes' else ''
              lines.append(f'| [{m[\"title\"]}]({m[\"url\"]}) | {m[\"source\"]} | Agenda only{vote} |')
          if d.get('transcript_based'):
              lines.append(f'\n---\n*{len(d[\"transcript_based\"])} other meeting(s) have full transcripts.*')
          print('\n'.join(lines))
          ")
          # Maintain ONE standing status issue instead of filing a new one every
          # run (6x/day created hundreds of duplicates). Update the open issue
          # if present; only create when none exists.
          EXISTING=$(gh issue list --state open --search "Agenda-only meetings need transcripts in:title" --json number --jq '.[0].number // empty')
          TITLE="📋 Agenda-only meetings need transcripts (updated $(date +%Y-%m-%d))"
          if [ -n "$EXISTING" ]; then
            echo "Updating standing issue #$EXISTING"
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "transcript-needed" 2>/dev/null || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Maintain cookie-expiry issue
        # The summarizer counts caption bot-block failures vs successes in
        # agenda_only_report.json. Blocks → open/update a loud issue with the
        # refresh runbook (GitHub's notification email IS the reminder —
        # exports last ~4-8 weeks and die without warning, so we detect
        # rather than schedule). Successes with no blocks → auto-close it.
        # Neither (no YouTube fetches this run) → leave it untouched.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f agenda_only_report.json ]; then
            echo "No run report — skipping."
            exit 0
          fi
          BLOCKS=$(python -c "import json; print(json.load(open('agenda_only_report.json')).get('caption_auth_blocks', 0))")
          OKS=$(python -c "import json; print(json.load(open('agenda_only_report.json')).get('caption_successes', 0))")
          EXISTING=$(gh issue list --state open --search "YouTube cookies expired in:title" --json number --jq '.[0].number // empty')
          if [ "$BLOCKS" -gt 0 ]; then
            TITLE="🍪 YouTube cookies expired — caption fetches blocked (detected $(date +%Y-%m-%d))"
            BODY="This run hit ${BLOCKS} bot-block failure(s) fetching YouTube captions — the YOUTUBE_COOKIES secret has likely expired (exports last ~4-8 weeks)."
            BODY="${BODY}"$'\n\n'"**Fix (~3 minutes):** follow [docs/cookie-refresh.md](https://github.com/${{ github.repository }}/blob/main/docs/cookie-refresh.md)."
            BODY="${BODY}"$'\n\n'"Until refreshed, YouTube-sourced meetings (Marathon County, Wausau, Weston) arrive via the residential gap sweep instead — delayed up to ~12 hours, nothing is lost."
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
              echo "Updated cookie issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "Opened cookie issue"
            fi
          elif [ "$OKS" -gt 0 ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Caption fetches are succeeding again (${OKS} this run) — the refreshed cookies are working. Auto-closing."
          else
            echo "No cookie signal this run (blocks=$BLOCKS, successes=$OKS)."
          fi

      - name: Maintain residential-fetcher issue
        # The residential machine is the only transcript path (CI can't reach
        # YouTube), and its scheduled task exits 0 even when the script fails
        # internally. The summarizer records when it first saw each skipped
        # video; one lingering past STALE_VIDEO_HOURS (36h — normal lag is
        # ~12h) means the residential sweep has probably stopped.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f agenda_only_report.json ]; then
            echo "No run report — skipping."
            exit 0
          fi
          STALE=$(python -c "import json; print(len(json.load(open('agenda_only_report.json')).get('stale_unprocessed', [])))")
          EXISTING=$(gh issue list --state open --search "Residential transcript fetcher may be down in:title" --json number --jq '.[0].number // empty')
          if [ "$STALE" -gt 0 ]; then
            LIST=$(python -c "
          import json
          for s in json.load(open('agenda_only_report.json'))['stale_unprocessed']:
              print(f\"- [{s['source']}] {s['title']} — unprocessed for {s['age_hours']}h\")
          ")
            TITLE="🏠 Residential transcript fetcher may be down (${STALE} video(s) stuck, checked $(date +%Y-%m-%d))"
            BODY="These YouTube videos have been unprocessed for over 36 hours. CI cannot fetch captions (cloud IPs are blocked), so they depend on the residential sweep — the MarathonMeetings-RefreshTranscripts task on the operator machine (7 AM / 7 PM). It normally clears a video within ~12 hours."
            BODY="${BODY}"$'\n\n'"${LIST}"
            BODY="${BODY}"$'\n\n'"**Check on the operator machine:** is the task running (Task Scheduler → last run result), and does \`python fetch_transcript.py --all\` succeed by hand? A silent break usually means a Python or yt-dlp environment change (see docs/cookie-refresh.md and CLAUDE.md notes). If the fetcher is fine and a video simply has no captions, add its ID to \`SKIP_VIDEO_IDS\` in config.py to dismiss it."
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
              echo "Updated residential-fetcher issue #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY"
              echo "Opened residential-fetcher issue"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "No videos stuck past the threshold anymore — the residential fetcher is delivering again. Auto-closing."
          else
            echo "No stale videos."
          fi

      - name: Surface summarizer failures
        # The summarize/inject steps use continue-on-error so the site still
        # deploys on API outages — but the run must still go red so failures
        # aren't silent. This runs AFTER deploy.
        if: steps.summarize.outcome == 'failure' || steps.inject_transcripts.outcome == 'failure'
        run: |
          echo "::error::Summarizer or transcript-injection failed earlier in this run (site still deployed with existing data). Check the step logs above — common cause: Anthropic API credit exhaustion."
          exit 1
